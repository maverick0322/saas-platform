name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Saas.Platform.sln

      - name: Build solution
        run: dotnet build Saas.Platform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Saas.Platform.sln --configuration Release --no-build --verbosity normal

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: docker build --file Dockerfile --tag saas-platform:ci-check .

      - name: Verify container health endpoints
        run: |
          docker run -d --rm --name saas-platform-ci -p 8080:8080 saas-platform:ci-check
          trap 'docker rm -f saas-platform-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health/live
          echo ""
          curl -fsS http://localhost:8080/health/ready
          echo ""
