name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/maverick0322/saas-platform

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Saas.Platform.sln

      - name: Build solution
        run: dotnet build Saas.Platform.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Saas.Platform.sln --configuration Release --no-build --verbosity normal

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image (no push)
        run: |
          docker build \
            --file Dockerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=saas-platform" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      - name: Verify container health endpoints
        run: |
          docker run -d --rm --name saas-platform-ci -p 8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}"
          trap 'docker rm -f saas-platform-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health/live
          echo ""
          curl -fsS http://localhost:8080/health/ready
          echo ""

      - name: Save validated image artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${IMAGE_NAME}:${GITHUB_SHA}" -o /tmp/saas-platform-image.tar

      - name: Upload validated image artifact (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas-platform-image-${{ github.sha }}
          path: /tmp/saas-platform-image.tar
          retention-days: 1
          if-no-files-found: error

  publish-ghcr:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - name: Download validated image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: saas-platform-image-${{ github.sha }}
          path: /tmp

      - name: Load validated container image
        run: docker load -i /tmp/saas-platform-image.tar

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push validated image and record digest
        run: |
          IMAGE_REF="${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_REF}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}")
          {
            echo "### GHCR Publication Summary"
            echo ""
            echo "- **Image reference:** \`${IMAGE_REF}\`"
            echo "- **Published digest:** \`${DIGEST}\`"
            echo "- **Source commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Event / Ref:** \`${GITHUB_EVENT_NAME}\` / \`${GITHUB_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io || true
